apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: "{{ .Values.images.order.repository }}:{{ .Values.images.tag }}"
          imagePullPolicy: Always

          ports:
            - containerPort: 4004

          env:
            - name: DB_HOST
              value: "mysql"

            - name: DB_USER
              value: "root"

            - name: DB_PASSWORD
              value: "root"

            - name: DB_NAME
              value: "order_db"

            - name: JWT_SECRET
              value: "base64:MyAyH94zgpW/jFFmSEhkKaQ/Rr4i9L7gJBmyyPpgy8Q="

            - name: CART_SERVICE_URL
              value: "http://cart-service:4003"

            - name: PRODUCT_SERVICE_URL
              value: "http://product-service:4002"

            - name: PORT
              value: "4004"

          
