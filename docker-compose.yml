services:
  mysql:
    build:
      context: .
      dockerfile: mysql-init/Dockerfile
    container_name: fieldstead-mysql
    image: fieldstead-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./services/auth-service
    container_name: fieldstead-auth
    image: fieldstead-auth
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: auth_db
      JWT_SECRET: change-this-secret-in-production
      PORT: 4001
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "4001"

  product-service:
    build: ./services/product-service
    container_name: fieldstead-products
    image: fieldstead-products
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: product_db
      JWT_SECRET: change-this-secret-in-production
      PORT: 4002
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "4002"

  cart-service:
    build: ./services/cart-service
    container_name: fieldstead-cart
    image: fieldstead-cart
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: cart_db
      JWT_SECRET: change-this-secret-in-production
      PRODUCT_SERVICE_URL: http://product-service:4002
      PORT: 4003
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "4003"

  order-service:
    build: ./services/order-service
    container_name: fieldstead-orders
    image: fieldstead-orders
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: order_db
      JWT_SECRET: change-this-secret-in-production
      CART_SERVICE_URL: http://cart-service:4003
      PRODUCT_SERVICE_URL: http://product-service:4002
      PORT: 4004
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "4004"

  api-gateway:
    build: ./api-gateway
    container_name: fieldstead-gateway
    image: fieldstead-gateway
    restart: unless-stopped
    environment:
      AUTH_SERVICE_URL: http://auth-service:4001
      PRODUCT_SERVICE_URL: http://product-service:4002
      CART_SERVICE_URL: http://cart-service:4003
      ORDER_SERVICE_URL: http://order-service:4004
      PORT: 4000
    depends_on:
      - auth-service
      - product-service
      - cart-service
      - order-service
    expose:
      - "4000"

  frontend:
    build: ./frontend
    container_name: fieldstead-frontend
    image: fieldstead-frontend
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api-gateway:4000
      SECRET_KEY: change-this-secret-in-production
      PORT: 3000
    depends_on:
      - api-gateway
    expose:
      - "3000"

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: fieldstead-nginx
    image: fieldstead-nginx
    restart: unless-stopped
    depends_on:
      - frontend
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"

volumes:
  mysql_data:
