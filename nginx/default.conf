# Fieldstead reverse proxy
# The browser only ever talks to nginx on port 80. Every request is
# forwarded to the frontend Flask service over the internal Docker
# network — the frontend, gateway, and all four backend microservices
# are no longer published to the host at all.

upstream fieldstead_frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain;
    gzip_min_length 256;

    location / {
        proxy_pass http://fieldstead_frontend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # Simple endpoint nginx itself answers, useful for load-balancer /
    # uptime-monitor health checks without hitting the app at all.
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
