{% extends "base.html" %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <h1 class="font-display mb-4 text-center">Sign In</h1>
      <form method="post" action="{{ url_for('do_login') }}">
        <input type="hidden" name="next" value="{{ next }}">
        <div class="mb-3">
          <label class="form-label small">Email</label>
          <input type="email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label small">Password</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-forest w-100 mt-2">Sign in</button>
      </form>
      <p class="text-center text-muted small mt-3">
        New to Fieldstead? <a href="{{ url_for('register') }}">Create an account</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
