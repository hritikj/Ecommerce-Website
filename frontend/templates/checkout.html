{% extends "base.html" %}
{% block content %}
<div class="container py-5">
  <h1 class="font-display mb-4">Checkout</h1>
  <div class="row g-5">
    <div class="col-lg-7">
      <form method="post" action="{{ url_for('place_order') }}">
        <h3 class="fs-5 font-display mb-3">Shipping Address</h3>
        <div class="mb-3">
          <label class="form-label small">Full address</label>
          <textarea name="shipping_address" class="form-control" rows="3" required
            placeholder="123 Orchard Lane, Springfield, IL 62704"></textarea>
        </div>
        <button type="submit" class="btn btn-forest btn-lg w-100 mt-2">Place order</button>
      </form>
    </div>
    <div class="col-lg-5">
      <div class="border rounded-1 p-4">
        <h3 class="font-display fs-5 mb-3">Order Summary</h3>
        {% for i in items %}
        <div class="d-flex justify-content-between small mb-2">
          <span>{{ i.product.name }} × {{ i.quantity }}</span>
          <span>${{ '%.2f'|format(i.product.price * i.quantity) }}</span>
        </div>
        {% endfor %}
        <hr>
        <div class="d-flex justify-content-between fw-semibold">
          <span>Total</span><span>${{ '%.2f'|format(subtotal) }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
